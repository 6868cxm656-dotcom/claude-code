name: Deploy SLT Agenda

on:
  push:
    branches:
      - claude/stoic-maxwell-eekkbo
    paths:
      - "slt-agenda/**"
      - ".github/workflows/deploy-slt-agenda.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the agenda app, so the site root is the planner.
          path: ./slt-agenda

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

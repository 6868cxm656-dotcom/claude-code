<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SLT Agenda — Senior Leadership Team</title>
<meta name="description" content="Shared weekly agenda planner for the senior leadership team." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: #EDF0F3;
    --panel: #FBFCFD;
    --text: #15212E;
    --muted: #5C6B7A;
    --line: #D5DCE3;
    --line-soft: #E4E9EE;
    --accent: #B5762B;
    --accent-soft: #F3E7D2;
    --teal: #2C6E6B;
    --teal-soft: #DCEAE8;
    --over: #A23B2D;
    --shadow: 0 1px 2px rgba(21, 33, 46, .06), 0 8px 24px rgba(21, 33, 46, .06);
    --serif: "Newsreader", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 24px 96px; }

  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 16px 24px; padding-bottom: 18px; border-bottom: 2px solid var(--text);
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .18em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
  }
  .title-input {
    font-family: var(--serif); font-size: clamp(28px, 5vw, 40px); font-weight: 500;
    line-height: 1.05; letter-spacing: -.01em; color: var(--text);
    border: 0; background: transparent; padding: 0; width: 100%; max-width: 540px;
  }
  .title-input:focus { outline: none; box-shadow: 0 2px 0 var(--accent); }

  .meta { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .field input {
    font-family: var(--mono); font-size: 15px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 130px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field input.short { width: 84px; }

  .capacity { margin-top: 20px; display: flex; align-items: center; gap: 14px; }
  .gauge { flex: 1; height: 8px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
  .gauge-fill {
    height: 100%; width: 0%; background: var(--accent); border-radius: 99px;
    transition: width .35s ease, background-color .35s ease;
  }
  .gauge-fill.over { background: var(--over); }
  .capacity-read { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .capacity-read b { color: var(--text); font-weight: 600; }
  .capacity-read .flag-over { color: var(--over); font-weight: 600; }
  .capacity-read .flag-room { color: var(--teal); font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 22px 0 18px; }
  button {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 13px; cursor: pointer; transition: border-color .15s ease, background-color .15s ease;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--text); color: var(--ground); border-color: var(--text); }
  button.primary:hover { background: #0c1620; }
  button.ghost { color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .picker {
    font-family: var(--sans); font-size: 13.5px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; max-width: 260px; cursor: pointer;
  }
  .picker:focus { outline: none; border-color: var(--accent); }

  .agenda { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 78px 1fr; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    margin-bottom: 12px; overflow: hidden; transition: box-shadow .15s ease, opacity .15s ease;
  }
  .item.dragging { opacity: .45; }
  .item.drop-target { box-shadow: 0 0 0 2px var(--accent); }
  .item.done .item-title { text-decoration: line-through; color: var(--muted); }
  .item.carry { border-left: 3px solid var(--accent); }

  .gutter {
    background: linear-gradient(180deg, #F4F6F8, #EEF1F4); border-right: 1px solid var(--line-soft);
    padding: 14px 10px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .gutter .clock {
    font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: .01em; color: var(--text);
  }
  .gutter .dur-wrap { display: inline-flex; align-items: baseline; gap: 1px; margin-top: 2px; }
  .gutter .dur {
    font-family: var(--mono); font-size: 12px; width: 30px; text-align: right; border: 0;
    background: transparent; color: var(--muted); padding: 0;
  }
  .gutter .dur:focus { outline: none; color: var(--accent); box-shadow: 0 1px 0 var(--accent); }
  .gutter .dur-unit { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .body { padding: 12px 14px 13px; }
  .row-top { display: flex; align-items: flex-start; gap: 10px; }
  .item-title {
    flex: 1; font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--text);
    border: 0; background: transparent; padding: 2px 0; line-height: 1.25;
  }
  .item-title:focus { outline: none; box-shadow: 0 1px 0 var(--line); }

  .owner {
    font-family: var(--mono); font-size: 12px; text-align: center; width: 52px;
    text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    border: 1px solid var(--line-soft); border-radius: 6px; padding: 5px 4px; background: var(--ground);
  }
  .owner:focus { outline: none; border-color: var(--accent); color: var(--text); }

  .type-select {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 500; border: 1px solid var(--line-soft); border-radius: 99px; padding: 5px 10px;
    background: var(--ground); color: var(--muted); cursor: pointer; appearance: none;
  }
  .type-select:focus { outline: none; border-color: var(--accent); }
  .type-decision { background: var(--teal-soft); color: var(--teal); border-color: transparent; }
  .type-update { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .type-discussion { background: #E5E9ED; color: #41546A; border-color: transparent; }
  .type-info { background: var(--ground); color: var(--muted); }

  .notes {
    width: 100%; margin-top: 8px; font-family: var(--sans); font-size: 14px; color: var(--text);
    line-height: 1.55; border: 0; border-top: 1px dashed var(--line-soft); background: transparent;
    padding: 8px 0 0; resize: vertical; min-height: 0; height: 24px; overflow: hidden;
  }
  .notes::placeholder { color: #9AA7B4; }
  .notes:focus { outline: none; }

  .actions-block { margin-top: 8px; }
  .action { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .action input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  .action .act-text {
    flex: 1; border: 0; background: transparent; font-size: 13.5px; color: var(--text); padding: 2px 0;
  }
  .action .act-text:focus { outline: none; box-shadow: 0 1px 0 var(--line); }
  .action.done .act-text { text-decoration: line-through; color: var(--muted); }
  .action .act-owner {
    width: 46px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; text-align: center;
    color: var(--muted); border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px; background: var(--ground);
  }
  .action .act-owner:focus { outline: none; border-color: var(--accent); }
  .act-remove {
    border: 0; background: transparent; color: #9AA7B4; cursor: pointer; font-size: 16px;
    line-height: 1; padding: 2px 4px;
  }
  .act-remove:hover { color: var(--over); }
  .add-action {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); background: transparent; border: 0; padding: 4px 0; cursor: pointer;
  }
  .add-action:hover { text-decoration: underline; }

  .item-ctrls { display: flex; gap: 2px; flex: none; }
  .ictrl {
    border: 0; background: transparent; cursor: pointer; color: #9AA7B4; padding: 4px;
    border-radius: 5px; font-size: 15px; line-height: 1;
  }
  .ictrl:hover { background: var(--ground); color: var(--text); }
  .ictrl.on { color: var(--accent); }
  .ictrl.handle { cursor: grab; }
  .ictrl.handle:active { cursor: grabbing; }

  .tags-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .standing-pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); border: 1px dashed var(--accent); border-radius: 99px; padding: 2px 8px;
  }

  .empty {
    text-align: center; padding: 48px 20px; border: 1px dashed var(--line); border-radius: 10px;
    color: var(--muted); background: var(--panel);
  }
  .empty h2 { font-family: var(--serif); font-weight: 500; color: var(--text); margin: 0 0 6px; }

  .footnote { margin-top: 26px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .footnote code {
    font-family: var(--mono); font-size: 11.5px; background: var(--panel);
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 1px 5px;
  }

  .save-state { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
  .save-state.error { color: var(--over); }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--ground); font-size: 13.5px; padding: 10px 16px;
    border-radius: 8px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .loading { text-align: center; color: var(--muted); padding: 60px 20px; font-family: var(--mono); font-size: 13px; }

  /* ---- meeting type (kind) ---- */
  .kindsel {
    font-family: var(--mono); font-size: 14px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; cursor: pointer;
  }
  .kindsel:focus { outline: none; border-color: var(--accent); }
  /* per-kind accent, used on badges, dots and column headers */
  .k-slt { --kind: var(--accent); }
  .k-board { --kind: var(--teal); }
  .k-subcommittee { --kind: #6A5ACD; }
  .k-team { --kind: #5C6B7A; }
  .kind-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 600; color: #fff; background: var(--kind, var(--accent));
    border-radius: 99px; padding: 2px 9px; white-space: nowrap;
  }

  /* ---- view tabs ---- */
  .viewtabs { display: flex; gap: 4px; margin-bottom: 18px; }
  .tab {
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    border-radius: 0; padding: 6px 10px;
  }
  .tab:hover { color: var(--text); border-color: var(--line); }
  .tab.on { color: var(--text); border-color: var(--accent); }

  /* ---- recording / transcript ---- */
  .recording {
    margin-top: 22px; padding: 18px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  }
  .rec-title { font-family: var(--serif); font-weight: 500; font-size: 19px; margin: 0 0 4px; }
  .rec-help { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .rec-row { display: flex; gap: 10px; align-items: center; }
  .rec-url {
    flex: 1; font-family: var(--sans); font-size: 14px; color: var(--text); background: var(--ground);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px;
  }
  .rec-url:focus { outline: none; border-color: var(--accent); }
  .rec-open {
    font-family: var(--mono); font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid var(--accent); border-radius: 7px; padding: 8px 12px; white-space: nowrap;
  }
  .rec-open:hover { background: var(--accent-soft); }
  .rec-transcript {
    width: 100%; margin-top: 12px; min-height: 90px; resize: vertical; font-family: var(--sans);
    font-size: 13.5px; line-height: 1.55; color: var(--text); background: var(--ground);
    border: 1px solid var(--line); border-radius: 7px; padding: 11px;
  }
  .rec-transcript:focus { outline: none; border-color: var(--accent); }

  /* ---- planner board ---- */
  .board-head {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 16px; padding-bottom: 18px; border-bottom: 2px solid var(--text); margin-bottom: 16px;
  }
  .board-title { font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 4vw, 34px); margin: 0; }
  .board-actions { display: flex; gap: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--kind); }

  .board { display: flex; flex-direction: column; gap: 26px; }
  .month-group h3 {
    font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px; font-weight: 500;
  }
  .columns { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .column {
    flex: 0 0 248px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    border-top: 3px solid var(--kind, var(--accent));
  }
  .column.drop-target { box-shadow: 0 0 0 2px var(--accent); }
  .col-head { padding: 12px 13px 10px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .col-head:hover .col-title { color: var(--accent); }
  .col-date { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .col-title { font-family: var(--serif); font-size: 16px; font-weight: 500; margin: 3px 0; line-height: 1.2; }
  .col-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .col-mins { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .col-cards { padding: 10px; display: flex; flex-direction: column; gap: 7px; min-height: 46px; flex: 1; }
  .card {
    background: var(--ground); border: 1px solid var(--line-soft); border-radius: 7px;
    padding: 8px 10px; cursor: grab; font-size: 13px; line-height: 1.35;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card .card-top { display: flex; align-items: center; gap: 6px; }
  .card .cdot { width: 7px; height: 7px; border-radius: 99px; flex: none; }
  .cdot.type-update { background: var(--accent); }
  .cdot.type-decision { background: var(--teal); }
  .cdot.type-discussion { background: #41546A; }
  .cdot.type-info { background: #9AA7B4; }
  .card .card-title { flex: 1; }
  .card.done .card-title { text-decoration: line-through; color: var(--muted); }
  .card .card-mins { font-family: var(--mono); font-size: 10px; color: var(--muted); flex: none; }
  .col-empty { font-size: 12px; color: #9AA7B4; text-align: center; padding: 10px 0; }

  /* ---- modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(21, 33, 46, .4); display: flex;
    align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal {
    background: var(--panel); border-radius: 12px; box-shadow: var(--shadow);
    width: 100%; max-width: 420px; padding: 22px;
  }
  .modal h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0 0 14px; }
  .modal .field { margin-bottom: 12px; }
  .modal .field input, .modal .field select {
    font-family: var(--sans); font-size: 14px; color: var(--text); background: var(--ground);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; width: 100%;
  }
  .modal .field input:focus, .modal .field select:focus { outline: none; border-color: var(--accent); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  @media (max-width: 560px) { .item { grid-template-columns: 62px 1fr; } .meta { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media print {
    body { background: #fff; }
    .toolbar, .item-ctrls, .add-action, .act-remove, .footnote, .save-state, .toast { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    .item { box-shadow: none; break-inside: avoid; border-color: #ccc; }
    .gauge { display: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <nav class="viewtabs">
      <button class="tab on" id="tabAgenda">Agenda</button>
      <button class="tab" id="tabBoard">Planner</button>
    </nav>

    <section id="agendaView">
    <header class="masthead">
      <div>
        <p class="eyebrow" id="mastheadEyebrow">Churchill Fellowship · Weekly</p>
        <input class="title-input" id="mtgTitle" aria-label="Meeting title" />
      </div>
      <div class="meta">
        <div class="field">
          <label for="mtgKind">Type</label>
          <select id="mtgKind" class="kindsel">
            <option value="slt">SLT</option>
            <option value="board">Board</option>
            <option value="subcommittee">Subcommittee</option>
            <option value="team">Team Meeting</option>
          </select>
        </div>
        <div class="field" id="labelField" hidden>
          <label for="mtgLabel">Committee</label>
          <input type="text" id="mtgLabel" placeholder="e.g. Finance" />
        </div>
        <div class="field">
          <label for="mtgDate">Date</label>
          <input type="date" id="mtgDate" />
        </div>
        <div class="field">
          <label for="mtgStart">Starts</label>
          <input type="time" id="mtgStart" class="short" />
        </div>
        <div class="field">
          <label for="mtgTarget">Length (min)</label>
          <input type="number" id="mtgTarget" class="short" min="5" step="5" />
        </div>
      </div>
    </header>

    <div class="capacity">
      <div class="gauge"><div class="gauge-fill" id="gaugeFill"></div></div>
      <div class="capacity-read" id="capacityRead"></div>
    </div>

    <div class="toolbar">
      <button class="primary" id="btnAdd">+ Add item</button>
      <button id="btnRoll">Roll forward to next week</button>
      <span class="spacer"></span>
      <label class="visually-hidden" for="meetingPicker">Choose meeting</label>
      <select class="picker" id="meetingPicker"></select>
      <button id="btnNew">New meeting</button>
      <button id="btnCopy">Copy for email</button>
      <button id="btnPrint">Print / PDF</button>
      <button class="ghost" id="btnDelete" title="Delete this meeting">Delete</button>
      <span class="save-state" id="saveState"></span>
    </div>

    <ul class="agenda" id="agenda"><li class="loading">Loading shared agenda…</li></ul>

    <section class="recording" id="recording">
      <h2 class="rec-title">Recording &amp; transcript</h2>
      <p class="rec-help">Paste the Granola share link for this meeting, and the transcript if you'd like it kept here.</p>
      <div class="rec-row">
        <input type="url" id="recUrl" class="rec-url" placeholder="https://notes.granola.ai/…" aria-label="Granola link" />
        <a class="rec-open" id="recOpen" target="_blank" rel="noopener" hidden>Open ↗</a>
      </div>
      <textarea id="recTranscript" class="rec-transcript" placeholder="Paste the transcript here (optional)…" aria-label="Transcript"></textarea>
    </section>

    <p class="footnote" id="footnote"></p>
    </section>

    <section id="boardView" hidden>
      <header class="board-head">
        <div>
          <p class="eyebrow">Churchill Fellowship · Planner</p>
          <h1 class="board-title">Upcoming meetings — next 3 months</h1>
        </div>
        <div class="board-actions">
          <button id="btnSchedule">Schedule SLT weekly…</button>
          <button class="primary" id="btnAddMeeting">+ Add meeting</button>
        </div>
      </header>
      <div class="legend" id="legend"></div>
      <div class="board" id="board"><div class="loading">Loading planner…</div></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-foot">
        <button id="modalCancel">Cancel</button>
        <button class="primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var TYPES = ["update", "decision", "discussion", "info"];
  var TYPE_LABEL = { update: "Update", decision: "Decision", discussion: "Discussion", info: "Info" };
  var KINDS = ["slt", "board", "subcommittee", "team"];
  var KIND_LABEL = { slt: "SLT", board: "Board", subcommittee: "Subcommittee", team: "Team Meeting" };
  var LAST_KEY = "slt-agenda-last-id";

  var current = null;   // the meeting currently being edited
  var meetings = [];    // summary list for the picker
  var me = "";          // signed-in email
  var view = "agenda";  // "agenda" | "board"

  var agendaEl = document.getElementById("agenda");

  function kindOf(m) { return KINDS.indexOf(m && m.kind) >= 0 ? m.kind : "slt"; }
  function kindLabel(m) { return (m && m.label) ? m.label : KIND_LABEL[kindOf(m)]; }

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clampInt(v, lo, hi) { v = parseInt(v, 10); if (isNaN(v)) v = 0; return Math.max(lo, Math.min(hi, v)); }

  function parseHM(hm) {
    var p = (hm || "09:00").split(":");
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function fmtHM(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }
  function totalMinutes() {
    return current.items.reduce(function (s, it) { return s + (parseInt(it.minutes, 10) || 0); }, 0);
  }
  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  function shortDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }
  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function nextWeekday() {
    var d = new Date();
    d.setDate(d.getDate() + 1);
    var day = d.getDay();
    if (day === 6) d.setDate(d.getDate() + 2);
    if (day === 0) d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }
  function mkItem(title, type, minutes, owner, standing) {
    return { id: uid(), title: title, type: type, minutes: minutes, owner: owner || "",
             notes: "", status: "todo", standing: !!standing, actions: [] };
  }
  var DEFAULT_TARGET = 120; // two hours

  // Standing items kept on every agenda. The first is pinned to the start;
  // the trailing block stays at the end (new items are added above them).
  function seedItems() {
    return [
      mkItem("Welcome", "info", 5, "", true),
      mkItem("Review Team Meeting agenda next week", "discussion", 5, "", true),
      mkItem("Review SLT agenda next week", "discussion", 5, "", true),
      mkItem("AOB", "info", 5, "", true)
    ];
  }

  // ---------- API ----------
  function api(path, opts) {
    return fetch("/api" + path, Object.assign({ headers: { "content-type": "application/json" } }, opts || {}))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.status === 204 ? null : r.json();
      });
  }

  // ---------- save (debounced, serialised) ----------
  var saveTimer, saving = false, pendingSave = false;
  function scheduleSave() {
    setStatus("Editing…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commitSave, 700);
  }
  function commitSave() {
    if (!current) return;
    if (saving) { pendingSave = true; return; }
    saving = true;
    setStatus("Saving…");
    api("/meetings/" + current.id, { method: "PUT", body: JSON.stringify(current) })
      .then(function (saved) {
        current.updated_at = saved.updated_at;
        current.updated_by = saved.updated_by;
        setStatus("Saved · " + nowTime(), false);
        syncSummary();
      })
      .catch(function () {
        setStatus("Couldn't save — will retry", true);
        pendingSave = true;
      })
      .then(function () {
        saving = false;
        if (pendingSave) { pendingSave = false; setTimeout(commitSave, 1200); }
      });
  }
  function setStatus(msg, isError) {
    var el = document.getElementById("saveState");
    el.textContent = msg;
    el.classList.toggle("error", !!isError);
  }
  function syncSummary() {
    var row = meetings.filter(function (m) { return m.id === current.id; })[0];
    if (row) { row.title = current.title; row.date = current.date; renderPicker(); }
  }

  // ---------- rendering ----------
  function render() {
    document.getElementById("mtgTitle").value = current.title;
    document.getElementById("mtgDate").value = current.date;
    document.getElementById("mtgStart").value = current.start;
    document.getElementById("mtgTarget").value = current.target;
    document.getElementById("mtgKind").value = kindOf(current);
    document.getElementById("mtgLabel").value = current.label || "";
    document.getElementById("labelField").hidden = kindOf(current) !== "subcommittee";
    document.getElementById("mastheadEyebrow").textContent = "Churchill Fellowship · " + KIND_LABEL[kindOf(current)];

    var recUrl = document.getElementById("recUrl");
    recUrl.value = current.recording_url || "";
    var recOpen = document.getElementById("recOpen");
    recOpen.hidden = !current.recording_url;
    if (current.recording_url) recOpen.href = current.recording_url;
    document.getElementById("recTranscript").value = current.transcript || "";

    agendaEl.innerHTML = "";
    if (!current.items.length) {
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.innerHTML = "<h2>No items yet</h2><div>Add your first agenda item to start building the running order.</div>";
      agendaEl.appendChild(empty);
    } else {
      current.items.forEach(function (it) { agendaEl.appendChild(renderItem(it)); });
    }
    recalc();
    updateFootnote();
  }

  function renderItem(it) {
    var li = document.createElement("li");
    li.className = "item" + (it.status === "done" ? " done" : "") + (it.status === "carry" ? " carry" : "");
    li.dataset.id = it.id;
    li.setAttribute("draggable", "false");

    var gutter = document.createElement("div");
    gutter.className = "gutter";
    var clock = document.createElement("div");
    clock.className = "clock";
    clock.dataset.clock = it.id;
    gutter.appendChild(clock);

    var durWrap = document.createElement("div");
    durWrap.className = "dur-wrap";
    var dur = document.createElement("input");
    dur.className = "dur"; dur.type = "number"; dur.min = "0"; dur.step = "5"; dur.value = it.minutes;
    dur.setAttribute("aria-label", "Minutes for " + (it.title || "item"));
    dur.addEventListener("input", function () { it.minutes = clampInt(dur.value, 0, 600); recalc(); scheduleSave(); });
    var unit = document.createElement("span");
    unit.className = "dur-unit"; unit.textContent = "m";
    durWrap.appendChild(dur); durWrap.appendChild(unit);
    gutter.appendChild(durWrap);

    var body = document.createElement("div");
    body.className = "body";

    var rowTop = document.createElement("div");
    rowTop.className = "row-top";

    var title = document.createElement("input");
    title.className = "item-title"; title.value = it.title; title.placeholder = "Agenda item…";
    title.setAttribute("aria-label", "Item title");
    title.addEventListener("input", function () { it.title = title.value; scheduleSave(); });

    var owner = document.createElement("input");
    owner.className = "owner"; owner.value = it.owner; owner.maxLength = 6; owner.placeholder = "—";
    owner.title = "Owner (initials)"; owner.setAttribute("aria-label", "Owner");
    owner.addEventListener("input", function () { it.owner = owner.value; scheduleSave(); });

    var ctrls = document.createElement("div");
    ctrls.className = "item-ctrls";
    ctrls.appendChild(iconBtn(it.status === "done" ? "✓" : "○", "Mark done", it.status === "done", function () {
      it.status = it.status === "done" ? "todo" : "done"; render(); scheduleSave();
    }));
    ctrls.appendChild(iconBtn("↦", "Carry to next week", it.status === "carry", function () {
      it.status = it.status === "carry" ? "todo" : "carry"; render(); scheduleSave();
    }));
    ctrls.appendChild(iconBtn("⤴", it.standing ? "Standing item (kept each week)" : "Make standing item", it.standing, function () {
      it.standing = !it.standing; render(); scheduleSave();
    }));
    ctrls.appendChild(iconBtn("✕", "Delete item", false, function () {
      current.items = current.items.filter(function (x) { return x.id !== it.id; });
      render(); scheduleSave();
    }));
    var handle = iconBtn("⠿", "Drag to reorder", false, null);
    handle.classList.add("handle");
    attachDrag(handle, li, it);
    ctrls.appendChild(handle);

    rowTop.appendChild(title); rowTop.appendChild(owner); rowTop.appendChild(ctrls);
    body.appendChild(rowTop);

    var tags = document.createElement("div");
    tags.className = "tags-row";
    var sel = document.createElement("select");
    sel.className = "type-select type-" + it.type;
    TYPES.forEach(function (t) {
      var o = document.createElement("option");
      o.value = t; o.textContent = TYPE_LABEL[t];
      if (t === it.type) o.selected = true;
      sel.appendChild(o);
    });
    sel.setAttribute("aria-label", "Item type");
    sel.addEventListener("change", function () {
      it.type = sel.value; sel.className = "type-select type-" + it.type; scheduleSave();
    });
    tags.appendChild(sel);
    if (it.standing) {
      var pill = document.createElement("span");
      pill.className = "standing-pill"; pill.textContent = "Standing";
      tags.appendChild(pill);
    }
    body.appendChild(tags);

    var notes = document.createElement("textarea");
    notes.className = "notes"; notes.value = it.notes; notes.placeholder = "Notes, context, decisions taken…";
    notes.setAttribute("aria-label", "Notes");
    notes.addEventListener("input", function () { it.notes = notes.value; autoGrow(notes); scheduleSave(); });
    body.appendChild(notes);
    requestAnimationFrame(function () { autoGrow(notes); });

    var ab = document.createElement("div");
    ab.className = "actions-block";
    (it.actions || []).forEach(function (act) { ab.appendChild(renderAction(it, act)); });
    var addAct = document.createElement("button");
    addAct.className = "add-action"; addAct.textContent = "+ Action";
    addAct.addEventListener("click", function () {
      it.actions = it.actions || [];
      var a = { id: uid(), text: "", owner: "", done: false };
      it.actions.push(a);
      ab.insertBefore(renderAction(it, a), addAct);
      scheduleSave();
    });
    ab.appendChild(addAct);
    body.appendChild(ab);

    li.appendChild(gutter); li.appendChild(body);
    return li;
  }

  function renderAction(it, act) {
    var row = document.createElement("div");
    row.className = "action" + (act.done ? " done" : "");
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = act.done; cb.setAttribute("aria-label", "Action done");
    cb.addEventListener("change", function () { act.done = cb.checked; row.classList.toggle("done", act.done); scheduleSave(); });
    var txt = document.createElement("input");
    txt.className = "act-text"; txt.value = act.text; txt.placeholder = "Action…";
    txt.addEventListener("input", function () { act.text = txt.value; scheduleSave(); });
    var own = document.createElement("input");
    own.className = "act-owner"; own.value = act.owner; own.maxLength = 6; own.placeholder = "—"; own.title = "Owner";
    own.addEventListener("input", function () { act.owner = own.value; scheduleSave(); });
    var rm = document.createElement("button");
    rm.className = "act-remove"; rm.textContent = "×"; rm.title = "Remove action";
    rm.addEventListener("click", function () {
      it.actions = it.actions.filter(function (x) { return x.id !== act.id; });
      row.remove(); scheduleSave();
    });
    row.appendChild(cb); row.appendChild(txt); row.appendChild(own); row.appendChild(rm);
    return row;
  }

  function iconBtn(glyph, title, on, fn) {
    var b = document.createElement("button");
    b.className = "ictrl" + (on ? " on" : "");
    b.textContent = glyph; b.title = title; b.setAttribute("aria-label", title);
    if (fn) b.addEventListener("click", fn);
    return b;
  }
  function autoGrow(ta) { ta.style.height = "24px"; if (ta.value) ta.style.height = ta.scrollHeight + "px"; }

  function recalc() {
    var t = parseHM(current.start);
    current.items.forEach(function (it) {
      var node = agendaEl.querySelector('[data-clock="' + it.id + '"]');
      if (node) node.textContent = fmtHM(t);
      t += parseInt(it.minutes, 10) || 0;
    });
    var total = totalMinutes();
    var target = parseInt(current.target, 10) || 0;
    var pct = target ? Math.min(100, Math.round((total / target) * 100)) : 0;
    var fill = document.getElementById("gaugeFill");
    fill.style.width = pct + "%";
    fill.classList.toggle("over", total > target);

    var read = document.getElementById("capacityRead");
    var ends = fmtHM(parseHM(current.start) + total);
    var diff = total - target, tail;
    if (diff > 0) tail = '<span class="flag-over">' + diff + " min over</span>";
    else if (diff < 0) tail = '<span class="flag-room">' + (-diff) + " min spare</span>";
    else tail = '<span class="flag-room">on time</span>';
    read.innerHTML = "<b>" + total + "</b> of <b>" + target + "</b> min planned · ends <b>" + ends + "</b> · " + tail;
  }

  function updateFootnote() {
    var by = current.updated_by ? (" · last edited by <b>" + escapeHtml(current.updated_by) + "</b>") : "";
    document.getElementById("footnote").innerHTML =
      "Signed in as <b>" + escapeHtml(me) + "</b> · shared with your team. Changes save automatically to the " +
      "shared database, so everyone sees the latest agenda" + by + ". <b>Roll forward</b> starts next week's " +
      "agenda, keeping standing items and anything marked to carry.";
  }
  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // ---------- drag & drop ----------
  var dragId = null;
  function attachDrag(handle, li, it) {
    handle.addEventListener("mousedown", function () { li.setAttribute("draggable", "true"); });
    handle.addEventListener("mouseup", function () { li.setAttribute("draggable", "false"); });
    li.addEventListener("dragstart", function (e) {
      dragId = it.id; li.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", it.id); } catch (err) {}
    });
    li.addEventListener("dragend", function () {
      li.classList.remove("dragging"); li.setAttribute("draggable", "false");
      Array.prototype.forEach.call(agendaEl.children, function (c) { c.classList.remove("drop-target"); });
      dragId = null;
    });
    li.addEventListener("dragover", function (e) {
      e.preventDefault();
      if (dragId && dragId !== it.id) li.classList.add("drop-target");
    });
    li.addEventListener("dragleave", function () { li.classList.remove("drop-target"); });
    li.addEventListener("drop", function (e) {
      e.preventDefault(); li.classList.remove("drop-target");
      if (!dragId || dragId === it.id) return;
      var from = current.items.findIndex(function (x) { return x.id === dragId; });
      var to = current.items.findIndex(function (x) { return x.id === it.id; });
      if (from < 0 || to < 0) return;
      var moved = current.items.splice(from, 1)[0];
      current.items.splice(to, 0, moved);
      render(); scheduleSave();
    });
  }

  // ---------- meeting picker ----------
  function renderPicker() {
    var sel = document.getElementById("meetingPicker");
    sel.innerHTML = "";
    meetings.forEach(function (m) {
      var o = document.createElement("option");
      o.value = m.id;
      o.textContent = shortDate(m.date) + " — " + (m.title || "Untitled");
      if (current && m.id === current.id) o.selected = true;
      sel.appendChild(o);
    });
  }

  function openMeeting(id) {
    setStatus("Loading…");
    return api("/meetings/" + id).then(function (m) {
      current = m;
      try { localStorage.setItem(LAST_KEY, id); } catch (e) {}
      renderPicker();
      render();
      setStatus("Up to date", false);
    });
  }

  function refreshMeetings() {
    return api("/meetings").then(function (list) { meetings = list || []; renderPicker(); });
  }

  // ---------- header inputs ----------
  document.getElementById("mtgTitle").addEventListener("input", function (e) { current.title = e.target.value; scheduleSave(); });
  document.getElementById("mtgDate").addEventListener("input", function (e) { current.date = e.target.value; scheduleSave(); });
  document.getElementById("mtgStart").addEventListener("input", function (e) { current.start = e.target.value; recalc(); scheduleSave(); });
  document.getElementById("mtgTarget").addEventListener("input", function (e) { current.target = clampInt(e.target.value, 0, 600); recalc(); scheduleSave(); });
  document.getElementById("mtgKind").addEventListener("change", function (e) {
    current.kind = e.target.value;
    document.getElementById("labelField").hidden = current.kind !== "subcommittee";
    document.getElementById("mastheadEyebrow").textContent = "Churchill Fellowship · " + KIND_LABEL[kindOf(current)];
    scheduleSave();
  });
  document.getElementById("mtgLabel").addEventListener("input", function (e) { current.label = e.target.value; scheduleSave(); });

  // ---------- recording / transcript ----------
  document.getElementById("recUrl").addEventListener("input", function (e) {
    current.recording_url = e.target.value.trim();
    var recOpen = document.getElementById("recOpen");
    recOpen.hidden = !current.recording_url;
    if (current.recording_url) recOpen.href = current.recording_url;
    scheduleSave();
  });
  document.getElementById("recTranscript").addEventListener("input", function (e) { current.transcript = e.target.value; scheduleSave(); });

  // ---------- view tabs ----------
  document.getElementById("tabAgenda").addEventListener("click", function () { switchView("agenda"); });
  document.getElementById("tabBoard").addEventListener("click", function () { switchView("board"); });

  function switchView(v) {
    view = v;
    document.getElementById("tabAgenda").classList.toggle("on", v === "agenda");
    document.getElementById("tabBoard").classList.toggle("on", v === "board");
    document.getElementById("agendaView").hidden = v !== "agenda";
    document.getElementById("boardView").hidden = v !== "board";
    if (v === "board") renderBoard();
  }

  // ---------- toolbar ----------
  document.getElementById("btnAdd").addEventListener("click", function () {
    // Insert above the trailing block of standing items (e.g. AOB), but keep
    // a standing first item (Welcome) at the top.
    var idx = current.items.length;
    while (idx > 1 && current.items[idx - 1].standing) idx--;
    var fresh = mkItem("", "discussion", 10, "");
    current.items.splice(idx, 0, fresh);
    render(); scheduleSave();
    var node = agendaEl.querySelector('.item[data-id="' + fresh.id + '"] .item-title');
    if (node) node.focus();
  });

  document.getElementById("meetingPicker").addEventListener("change", function (e) {
    commitSave();
    openMeeting(e.target.value);
  });

  document.getElementById("btnNew").addEventListener("click", function () {
    commitSave();
    setStatus("Creating…");
    api("/meetings", { method: "POST", body: JSON.stringify({
      title: current ? current.title : "Senior Leadership Team",
      date: nextWeekday(),
      start: current ? current.start : "09:00",
      target: current ? current.target : DEFAULT_TARGET,
      items: seedItems()
    }) }).then(function (m) {
      return refreshMeetings().then(function () { return openMeeting(m.id); });
    }).then(function () { toast("New meeting created"); });
  });

  document.getElementById("btnRoll").addEventListener("click", function () {
    commitSave();
    var kept = current.items
      .filter(function (it) { return it.standing || it.status === "carry"; })
      .map(function (it) {
        var open = (it.actions || []).filter(function (a) { return !a.done; })
          .map(function (a) { return { text: a.text, owner: a.owner, done: false }; });
        return { title: it.title, type: it.type, minutes: it.minutes, owner: it.owner,
                 notes: "", status: "todo", standing: it.standing, actions: open };
      });
    var d = new Date(current.date + "T00:00:00");
    d.setDate(d.getDate() + 7);
    setStatus("Rolling forward…");
    api("/meetings", { method: "POST", body: JSON.stringify({
      title: current.title, date: d.toISOString().slice(0, 10),
      start: current.start, target: current.target,
      kind: kindOf(current), label: current.label || "",
      items: kept.length ? kept : seedItems()
    }) }).then(function (m) {
      return refreshMeetings().then(function () { return openMeeting(m.id); });
    }).then(function () {
      toast("Rolled forward to " + formatDate(current.date) + " · kept " + kept.length + " item(s)");
    });
  });

  document.getElementById("btnDelete").addEventListener("click", function () {
    if (!current) return;
    if (!confirm("Delete this meeting (" + shortDate(current.date) + ") for everyone? This can't be undone.")) return;
    var gone = current.id;
    setStatus("Deleting…");
    api("/meetings/" + gone, { method: "DELETE" }).then(function () {
      return refreshMeetings();
    }).then(function () {
      if (meetings.length) return openMeeting(meetings[0].id);
      return createSeedMeeting();
    }).then(function () { toast("Meeting deleted"); });
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    var md = toMarkdown();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(
        function () { toast("Agenda copied — paste into your email"); },
        function () { fallbackCopy(md); }
      );
    } else { fallbackCopy(md); }
  });

  document.getElementById("btnPrint").addEventListener("click", function () { window.print(); });

  // ---------- export ----------
  function toMarkdown() {
    var lines = [];
    lines.push(current.title + " — Agenda");
    lines.push(formatDate(current.date) + " · " + current.start + " · " + totalMinutes() + " min planned");
    lines.push("");
    var t = parseHM(current.start);
    current.items.forEach(function (it, i) {
      var time = fmtHM(t); t += parseInt(it.minutes, 10) || 0;
      var who = it.owner ? " (" + it.owner + ")" : "";
      var mark = it.status === "done" ? "✓ " : (it.status === "carry" ? "↦ " : "");
      lines.push((i + 1) + ". " + time + " · " + mark + (it.title || "Untitled") +
        " — " + TYPE_LABEL[it.type] + ", " + (it.minutes || 0) + " min" + who);
      if (it.notes) lines.push("   " + it.notes.replace(/\n/g, "\n   "));
      (it.actions || []).forEach(function (a) {
        if (a.text) lines.push("   - [" + (a.done ? "x" : " ") + "] " + a.text + (a.owner ? " — " + a.owner : ""));
      });
    });
    return lines.join("\n");
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Agenda copied — paste into your email"); }
    catch (e) { toast("Couldn't copy automatically"); }
    ta.remove();
  }

  // ---------- toast ----------
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  function createSeedMeeting() {
    return api("/meetings", { method: "POST", body: JSON.stringify({
      title: "Senior Leadership Team", date: nextWeekday(), start: "09:00", target: DEFAULT_TARGET, items: seedItems()
    }) }).then(function (m) {
      return refreshMeetings().then(function () { return openMeeting(m.id); });
    });
  }

  // ---------- planner board ----------
  var boardEl = document.getElementById("board");
  var boardMeetings = [];
  var boardDrag = null;

  function loadBoard() {
    return api("/meetings?items=1").then(function (list) { boardMeetings = list || []; });
  }

  function renderLegend() {
    var legend = document.getElementById("legend");
    legend.innerHTML = "";
    KINDS.forEach(function (k) {
      var s = document.createElement("span");
      s.className = "k-" + k;
      s.innerHTML = '<span class="dot"></span>' + KIND_LABEL[k];
      legend.appendChild(s);
    });
  }

  function renderBoard() {
    renderLegend();
    boardEl.innerHTML = '<div class="loading">Loading planner…</div>';
    loadBoard().then(function () {
      boardEl.innerHTML = "";
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var from = new Date(today); from.setDate(from.getDate() - 7);
      var to = new Date(today); to.setDate(to.getDate() + 92);
      var fromIso = from.toISOString().slice(0, 10), toIso = to.toISOString().slice(0, 10);
      var shown = boardMeetings.filter(function (m) { return m.date >= fromIso && m.date <= toIso; });
      shown.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

      if (!shown.length) {
        boardEl.innerHTML = '<div class="empty"><h2>No meetings in the next 3 months</h2>' +
          '<div>Use “Schedule SLT weekly” or “+ Add meeting” to fill in the planner.</div></div>';
        return;
      }

      var groups = [], byKey = {};
      shown.forEach(function (m) {
        var d = new Date(m.date + "T00:00:00");
        var key = d.getFullYear() + "-" + d.getMonth();
        if (!byKey[key]) {
          byKey[key] = { label: d.toLocaleDateString("en-GB", { month: "long", year: "numeric" }), items: [] };
          groups.push(byKey[key]);
        }
        byKey[key].items.push(m);
      });

      groups.forEach(function (g) {
        var wrap = document.createElement("div");
        wrap.className = "month-group";
        var h = document.createElement("h3");
        h.textContent = g.label;
        wrap.appendChild(h);
        var cols = document.createElement("div");
        cols.className = "columns";
        g.items.forEach(function (m) { cols.appendChild(renderColumn(m)); });
        wrap.appendChild(cols);
        boardEl.appendChild(wrap);
      });
    }).catch(function () {
      boardEl.innerHTML = '<div class="empty"><h2>Couldn\'t load the planner</h2><div>Please refresh and try again.</div></div>';
    });
  }

  function renderColumn(m) {
    var col = document.createElement("div");
    col.className = "column k-" + kindOf(m);
    col.dataset.id = m.id;

    var head = document.createElement("div");
    head.className = "col-head";
    var total = (m.items || []).reduce(function (s, it) { return s + (parseInt(it.minutes, 10) || 0); }, 0);
    var date = document.createElement("div");
    date.className = "col-date"; date.textContent = shortDate(m.date);
    var title = document.createElement("div");
    title.className = "col-title"; title.textContent = m.title || "Untitled";
    var meta = document.createElement("div");
    meta.className = "col-meta";
    var badge = document.createElement("span");
    badge.className = "kind-badge"; badge.textContent = kindLabel(m);
    var mins = document.createElement("span");
    mins.className = "col-mins"; mins.textContent = total + " min" + (m.has_recording ? " · 🎙" : "");
    meta.appendChild(badge); meta.appendChild(mins);
    head.appendChild(date); head.appendChild(title); head.appendChild(meta);
    head.addEventListener("click", function () {
      commitSave();
      openMeeting(m.id).then(function () { switchView("agenda"); });
    });
    col.appendChild(head);

    var cards = document.createElement("div");
    cards.className = "col-cards"; cards.dataset.id = m.id;
    if (!(m.items || []).length) {
      var e = document.createElement("div");
      e.className = "col-empty"; e.textContent = "No items";
      cards.appendChild(e);
    } else {
      m.items.forEach(function (it) { cards.appendChild(renderCard(it, m.id)); });
    }
    attachColumnDrop(cards, col, m.id);
    col.appendChild(cards);
    return col;
  }

  function renderCard(it, meetingId) {
    var c = document.createElement("div");
    c.className = "card" + (it.status === "done" ? " done" : "");
    c.setAttribute("draggable", "true");
    var top = document.createElement("div");
    top.className = "card-top";
    var dot = document.createElement("span");
    dot.className = "cdot type-" + it.type;
    var t = document.createElement("span");
    t.className = "card-title"; t.textContent = it.title || "Untitled";
    var mn = document.createElement("span");
    mn.className = "card-mins"; mn.textContent = (it.minutes || 0) + "m";
    top.appendChild(dot); top.appendChild(t); top.appendChild(mn);
    c.appendChild(top);
    c.addEventListener("dragstart", function (e) {
      boardDrag = { itemId: it.id, fromId: meetingId };
      c.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", it.id); } catch (err) {}
    });
    c.addEventListener("dragend", function () {
      c.classList.remove("dragging");
      Array.prototype.forEach.call(document.querySelectorAll(".column"), function (x) { x.classList.remove("drop-target"); });
      boardDrag = null;
    });
    return c;
  }

  function attachColumnDrop(cards, col, meetingId) {
    cards.addEventListener("dragover", function (e) {
      if (!boardDrag) return;
      e.preventDefault(); col.classList.add("drop-target");
    });
    cards.addEventListener("dragleave", function () { col.classList.remove("drop-target"); });
    cards.addEventListener("drop", function (e) {
      e.preventDefault(); col.classList.remove("drop-target");
      if (!boardDrag || boardDrag.fromId === meetingId) return;
      var moving = boardDrag; boardDrag = null;
      setStatus("Moving item…");
      api("/move", { method: "POST", body: JSON.stringify({
        itemId: moving.itemId, fromId: moving.fromId, toId: meetingId
      }) }).then(function () {
        if (current && (current.id === moving.fromId || current.id === meetingId)) {
          return openMeeting(current.id).then(renderBoard);
        }
        renderBoard();
        toast("Item moved");
      }).catch(function () { setStatus("Couldn't move item", true); renderBoard(); });
    });
  }

  // ---------- modal ----------
  function openModal(title, fieldsHtml, okLabel, onOk) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = fieldsHtml;
    var ok = document.getElementById("modalOk");
    var cancel = document.getElementById("modalCancel");
    ok.textContent = okLabel;
    var modal = document.getElementById("modal");
    modal.hidden = false;
    function close() { modal.hidden = true; ok.onclick = null; cancel.onclick = null; }
    cancel.onclick = close;
    ok.onclick = function () { if (onOk() !== false) close(); };
  }

  function nextWeekdayDate(targetDow) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    var add = (targetDow - d.getDay() + 7) % 7;
    if (add === 0) add = 7;
    d.setDate(d.getDate() + add);
    return d.toISOString().slice(0, 10);
  }

  document.getElementById("btnSchedule").addEventListener("click", function () {
    openModal("Schedule SLT weekly",
      '<div class="field"><label>Start date</label><input type="date" id="schFrom" value="' + nextWeekdayDate(1) + '"></div>' +
      '<div class="field"><label>Time</label><input type="time" id="schStart" value="09:00"></div>' +
      '<div class="field"><label>Length (min)</label><input type="number" id="schTarget" value="120" min="5" step="5"></div>' +
      '<div class="field"><label>How many weeks</label><input type="number" id="schWeeks" value="13" min="1" max="26"></div>',
      "Create meetings",
      function () {
        var fromDate = document.getElementById("schFrom").value;
        if (!fromDate) return false;
        var body = {
          fromDate: fromDate,
          start: document.getElementById("schStart").value,
          target: clampInt(document.getElementById("schTarget").value, 5, 600),
          weeks: clampInt(document.getElementById("schWeeks").value, 1, 26),
          kind: "slt", title: "Senior Leadership Team"
        };
        setStatus("Scheduling…");
        api("/schedule", { method: "POST", body: JSON.stringify(body) }).then(function (r) {
          return refreshMeetings().then(function () {
            renderBoard(); toast("Added " + r.created + " meeting(s)"); setStatus("Up to date", false);
          });
        }).catch(function () { setStatus("Couldn't schedule", true); });
      });
  });

  document.getElementById("btnAddMeeting").addEventListener("click", function () {
    var opts = KINDS.map(function (k) { return '<option value="' + k + '">' + KIND_LABEL[k] + '</option>'; }).join("");
    openModal("Add meeting",
      '<div class="field"><label>Type</label><select id="amKind">' + opts + '</select></div>' +
      '<div class="field"><label>Title</label><input type="text" id="amTitle" placeholder="e.g. Board meeting"></div>' +
      '<div class="field"><label>Date</label><input type="date" id="amDate" value="' + nextWeekdayDate(1) + '"></div>' +
      '<div class="field"><label>Time</label><input type="time" id="amStart" value="09:00"></div>' +
      '<div class="field"><label>Length (min)</label><input type="number" id="amTarget" value="120" min="5" step="5"></div>',
      "Add meeting",
      function () {
        var kind = document.getElementById("amKind").value;
        var date = document.getElementById("amDate").value;
        if (!date) return false;
        var defTitle = kind === "slt" ? "Senior Leadership Team" : KIND_LABEL[kind] + " meeting";
        var body = {
          kind: kind, title: document.getElementById("amTitle").value || defTitle,
          date: date, start: document.getElementById("amStart").value,
          target: clampInt(document.getElementById("amTarget").value, 5, 600),
          items: seedItems()
        };
        setStatus("Creating…");
        api("/meetings", { method: "POST", body: JSON.stringify(body) }).then(function () {
          return refreshMeetings().then(function () {
            renderBoard(); toast("Meeting added"); setStatus("Up to date", false);
          });
        }).catch(function () { setStatus("Couldn't add meeting", true); });
      });
  });

  // ---------- boot ----------
  function fail(msg) {
    agendaEl.innerHTML = '<li class="empty"><h2>Couldn\'t load</h2><div>' + escapeHtml(msg) + "</div></li>";
    setStatus("Offline", true);
  }

  api("/whoami")
    .then(function (w) { me = w.email; return refreshMeetings(); })
    .then(function () {
      if (!meetings.length) return createSeedMeeting();
      var lastId = null;
      try { lastId = localStorage.getItem(LAST_KEY); } catch (e) {}
      var pick = meetings.filter(function (m) { return m.id === lastId; })[0] || meetings[0];
      return openMeeting(pick.id);
    })
    .catch(function () { fail("Couldn't reach the server. Check your connection and refresh."); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SLT Scoreboard</title>
<meta name="description" content="Thematic goal scoreboard and meeting rhythm for a senior leadership team." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: #EDF0F3;
    --panel: #FBFCFD;
    --text: #15212E;
    --muted: #5C6B7A;
    --faint: #9AA7B4;
    --line: #D5DCE3;
    --line-soft: #E4E9EE;
    --accent: #B5762B;
    --accent-soft: #F3E7D2;
    --teal: #2C6E6B;
    --teal-soft: #DCEAE8;
    --green: #2F7D55;
    --green-soft: #DDEFE4;
    --amber: #C99317;
    --amber-soft: #F7ECCB;
    --red: #B23A2E;
    --red-soft: #F5DEDA;
    --plum: #7A4E8C;
    --navy: #2B4C7E;
    --shadow: 0 1px 2px rgba(21, 33, 46, .06), 0 8px 24px rgba(21, 33, 46, .06);
    --serif: "Newsreader", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 24px 96px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 14px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--text);
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .18em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
  }
  .goal-title {
    font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4.6vw, 44px);
    line-height: 1.04; letter-spacing: -.01em; margin: 0;
  }
  .goal-meta { margin: 8px 0 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .who { display: flex; align-items: center; gap: 10px; }
  .who label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .save-state { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; min-width: 90px; text-align: right; }
  .save-state.error { color: var(--red); }

  .banner {
    margin: 14px 0 0; padding: 10px 14px; border-radius: 8px; font-size: 13.5px;
    background: var(--amber-soft); border: 1px solid #E7D29B; color: #5B4510;
  }
  .banner a { font-weight: 600; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px 0 22px; border-bottom: 1px solid var(--line); }
  .tab {
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    text-decoration: none; color: var(--muted); padding: 9px 12px 10px; border-bottom: 2px solid transparent;
    margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .count { font-size: 10px; background: var(--red); color: #fff; border-radius: 99px; padding: 0 6px; letter-spacing: 0; }

  /* ---------- generic controls ---------- */
  .btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--text); color: var(--ground); border-color: var(--text); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line); }
  .btn.small { font-size: 12.5px; padding: 5px 10px; }
  .btn.danger { color: var(--red); }
  .icon-btn {
    border: 0; background: transparent; color: var(--faint); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 5px;
  }
  .icon-btn:hover { color: var(--red); background: var(--ground); }
  .handle { cursor: grab; color: var(--faint); }
  .handle:hover { color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }

  .in, .ta, .sel {
    font-family: var(--sans); font-size: 14px; color: var(--text); background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; width: 100%; min-width: 0;
  }
  .in:hover, .ta:hover { border-color: var(--line-soft); }
  .in:focus, .ta:focus, .sel:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  .ta { resize: none; overflow: hidden; line-height: 1.5; display: block; }
  .in::placeholder, .ta::placeholder { color: var(--faint); }
  .sel { border-color: var(--line-soft); background: var(--panel); cursor: pointer; width: auto; }
  .boxed { border-color: var(--line); background: var(--panel); }
  .in-title { font-family: var(--serif); font-size: 20px; font-weight: 500; padding: 2px 6px; }
  .in-small { width: 100%; font-size: 13px; }
  .in-mono { font-family: var(--mono); font-size: 13px; }
  .gap { border: 1px dashed #D9B35A !important; background: #FBF5E4 !important; }
  .gap::placeholder { color: #A67C17; }

  .label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 4px; display: block;
  }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .mono { font-family: var(--mono); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; }
  .h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0 0 8px; }

  /* ---------- status (RAG) ---------- */
  .s-green { --rag: var(--green); --rag-soft: var(--green-soft); }
  .s-amber { --rag: var(--amber); --rag-soft: var(--amber-soft); }
  .s-red { --rag: var(--red); --rag-soft: var(--red-soft); }
  .s-none { --rag: var(--faint); --rag-soft: var(--line-soft); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px;
    font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--rag);
    background: var(--rag-soft); border-radius: 99px; padding: 2px 9px; white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--rag); }
  .rag { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .rag-btn {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase;
    border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .rag-btn:last-child { border-right: 0; }
  .rag-btn::before { content: ""; width: 8px; height: 8px; border-radius: 99px; border: 1.5px solid var(--rag); }
  .rag-btn:hover { color: var(--text); }
  .rag-btn.on { background: var(--rag); color: #fff; }
  .rag-btn.on::before { background: #fff; border-color: #fff; }
  .rag.compact .rag-btn { padding: 4px 7px; font-size: 10px; }

  /* ---------- scoreboard ---------- */
  .ledger {
    display: flex; flex-wrap: wrap; gap: 6px 22px; font-family: var(--mono); font-size: 12px;
    color: var(--muted); padding: 12px 0 18px; align-items: center;
  }
  .ledger b { color: var(--text); font-weight: 600; }
  .ledger .k { letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; }
  .ledger .warn { color: var(--red); font-weight: 600; }
  .ledger .amberish { color: #94690C; font-weight: 600; }
  .next-up {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; margin-bottom: 18px;
    border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; text-decoration: none;
  }
  .next-up:hover { border-color: var(--muted); }

  .objs { display: flex; flex-direction: column; gap: 14px; }
  .obj {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    border-left: 6px solid var(--rag); padding: 14px 16px 12px 16px;
  }
  .obj-top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .obj-short { font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .obj-owner { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .obj-owner .in { width: 120px; font-family: var(--mono); font-size: 12px; padding: 2px 5px; }
  .trend { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
  .trend .tl { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--faint); margin-right: 4px; text-transform: uppercase; }
  .trend i { width: 10px; height: 10px; border-radius: 99px; border: 1.5px solid var(--line); display: inline-block; }
  .trend i.s-green, .trend i.s-amber, .trend i.s-red { background: var(--rag); border-color: var(--rag); }
  .trend i.now { outline: 1.5px solid var(--text); outline-offset: 1.5px; }
  .obj-status { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 8px 0 4px; }
  .obj-status .in-note { flex: 1 1 260px; }
  .fresh { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .fresh.stale { color: var(--red); }
  .success { display: grid; grid-template-columns: 130px 1fr; gap: 8px; align-items: start; margin-top: 4px; }
  .success .label { padding-top: 8px; }
  .tasks-toggle {
    margin-top: 6px; border: 0; background: transparent; padding: 6px 0; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--text); display: inline-flex; gap: 10px; align-items: center;
  }
  .tasks-toggle .tk { color: var(--muted); }
  .tasks-toggle .warn { color: var(--red); }
  .tasks-toggle .amberish { color: #94690C; }

  .tasks { margin-top: 4px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
  .trow {
    display: grid; grid-template-columns: 26px minmax(0, 1fr) 140px 120px 142px 30px;
    gap: 6px; align-items: center; padding: 3px 0; border-radius: 6px;
  }
  .trow.thead { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 2px 0; }
  .trow.thead span { padding: 0 7px; }
  .trow input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); justify-self: center; }
  .trow.done .in:not([type="date"]) { text-decoration: line-through; color: var(--muted); }
  .trow.overdue { background: linear-gradient(90deg, var(--red-soft), transparent 60%); }
  .trow.overdue .in-date { color: var(--red); font-weight: 600; }
  .in-date { font-family: var(--mono); font-size: 12.5px; }
  .tphase { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 10px 0 2px 32px; }

  .soo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 34px 0 12px; }
  .soo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .soo { padding: 12px 14px; border-top: 4px solid var(--rag); }
  .soo .in-title { font-size: 17px; }

  .empty {
    text-align: center; padding: 44px 20px; border: 1px dashed var(--line); border-radius: 10px;
    color: var(--muted); background: var(--panel);
  }
  .empty h2 { font-family: var(--serif); font-weight: 500; color: var(--text); margin: 0 0 6px; }
  .empty .row { justify-content: center; margin-top: 14px; }

  /* ---------- meeting kinds ---------- */
  .k-tactical { --kind: var(--accent); }
  .k-strategic { --kind: var(--teal); }
  .k-offsite { --kind: var(--plum); }
  .k-board { --kind: var(--navy); }
  .k-subcommittee { --kind: #5C6B7A; }
  .k-team { --kind: #8A97A5; }
  .kind-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    color: #fff; background: var(--kind); border-radius: 99px; padding: 2px 9px; white-space: nowrap;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend i { width: 10px; height: 10px; border-radius: 99px; background: var(--kind); }

  /* ---------- planner ---------- */
  .planner { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
  .months { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .month h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 500; }
  .cols { display: flex; flex-wrap: wrap; gap: 12px; }
  .mcol {
    flex: 0 0 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); border-top: 4px solid var(--kind); display: flex; flex-direction: column;
  }
  .mcol.past { opacity: .62; }
  .mcol.next { box-shadow: 0 0 0 2px var(--kind), var(--shadow); }
  .mcol.drop { box-shadow: 0 0 0 2px var(--accent); }
  .mcol-head { padding: 10px 12px 8px; text-decoration: none; display: block; border-bottom: 1px solid var(--line-soft); }
  .mcol-head:hover .mcol-title { color: var(--accent); }
  .mcol-date { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .mcol-title { font-family: var(--serif); font-size: 16px; font-weight: 500; margin: 3px 0 4px; line-height: 1.2; }
  .mcol-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .chips { padding: 9px; display: flex; flex-direction: column; gap: 6px; min-height: 44px; flex: 1; }
  .chip {
    background: var(--ground); border: 1px solid var(--line-soft); border-radius: 7px; padding: 6px 9px;
    font-size: 12.5px; line-height: 1.35; cursor: grab;
  }
  .chip:active { cursor: grabbing; }
  .chip .flag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; }
  .chip.dragging { opacity: .4; }
  .chips .none { font-size: 12px; color: var(--faint); text-align: center; padding: 6px 0; }
  .sidebar { position: sticky; top: 14px; padding: 14px; }
  .sidebar.drop { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  .sidebar .chips { padding: 8px 0 0; }

  /* ---------- meeting page ---------- */
  .back { font-family: var(--mono); font-size: 12px; text-decoration: none; color: var(--muted); }
  .back:hover { color: var(--text); }
  .mhead { padding: 16px 18px; margin: 12px 0 18px; border-top: 4px solid var(--kind); }
  .mhead-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .mhead .in-title { font-size: 28px; margin: 6px 0 8px; }
  .fields { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field .in { border-color: var(--line); background: var(--panel); font-family: var(--mono); font-size: 13.5px; }
  .field .sel { font-family: var(--mono); font-size: 13.5px; padding: 5px 7px; }
  .budget { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .budget b { color: var(--text); }
  .budget .over { color: var(--red); font-weight: 600; }

  .meeting-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
  .secs { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px 16px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; }
  .sec-num {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--panel); background: var(--kind);
    border-radius: 99px; width: 22px; height: 22px; display: inline-grid; place-items: center; flex: none;
    transform: translateY(-2px);
  }
  .sec-title { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
  .sec-time { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .sec-hint { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
  .aside { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 14px; }
  .aside .panel { padding: 14px; }
  .aside ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .aside li { margin: 4px 0; }
  .rule-name { font-weight: 600; }

  .lr { display: grid; grid-template-columns: 90px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; padding: 3px 0; }
  .lr .who-name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .lr .in { border-color: var(--line-soft); }

  .review { display: flex; flex-direction: column; gap: 4px; }
  .rv { display: grid; grid-template-columns: auto 140px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); }
  .rv:last-child { border-bottom: 0; }
  .rv-who { display: flex; flex-direction: column; padding-top: 2px; }
  .rv-note { display: flex; flex-direction: column; gap: 1px; }
  .rv-note .fresh { padding-left: 7px; white-space: normal; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .rv-name { font-weight: 600; font-size: 13.5px; }
  .rv-owner { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .callout {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; border-radius: 8px;
    background: var(--rag-soft); border: 1px solid var(--rag); font-size: 13.5px; margin-top: 8px;
  }
  .callout b { color: var(--rag); }
  .subhead { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .soo-line { display: flex; flex-wrap: wrap; gap: 8px; }

  .alist { display: flex; flex-direction: column; gap: 2px; }
  .arow { display: grid; grid-template-columns: 26px minmax(0, 1fr) 120px 142px 130px 30px; gap: 6px; align-items: center; padding: 2px 0; }
  .arow input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); justify-self: center; }
  .arow.done .act-text { text-decoration: line-through; color: var(--muted); }
  .arow.overdue .in-date { color: var(--red); font-weight: 600; }
  .src { font-family: var(--mono); font-size: 11px; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a.src:hover { color: var(--text); }

  .topics { display: flex; flex-direction: column; gap: 10px; }
  .topic { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--panel); }
  .topic.dragging { opacity: .4; }
  .topic.drop { box-shadow: 0 0 0 2px var(--accent); }
  .topic-top { display: grid; grid-template-columns: 20px 112px minmax(0, 1fr) 130px 64px auto; gap: 6px; align-items: center; }
  .topic .in-title { font-size: 17px; }
  .topic-src { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 4px 0 0 26px; }
  .topic-body { margin: 6px 0 0 26px; display: flex; flex-direction: column; gap: 6px; }
  .mins { display: inline-flex; align-items: baseline; gap: 2px; }
  .mins .in { width: 44px; text-align: right; font-family: var(--mono); font-size: 13px; padding: 4px; }
  .mins span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .flag-sel { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 6px; }
  .f-inform { color: var(--muted); }
  .f-debate { color: var(--teal); }
  .f-decide { color: var(--accent); font-weight: 600; }
  .tri { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
  .tri label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .tri .note { font-size: 12px; color: #94690C; }
  .genius { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .gchip {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); border-radius: 99px; padding: 2px 9px; cursor: pointer;
  }
  .gchip.on { background: var(--text); color: var(--ground); border-color: var(--text); }
  .kv2 { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 8px; align-items: start; }
  .kv2 .label { padding-top: 8px; margin: 0; }

  .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .crow { display: grid; grid-template-columns: minmax(0, 1fr) 130px 130px 30px; gap: 6px; align-items: center; padding: 2px 0; }
  .drow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 150px 30px; gap: 6px; align-items: center; padding: 2px 0; }
  .commit-low { color: var(--red); font-family: var(--mono); font-size: 11px; grid-column: 1 / -1; padding-left: 7px; }

  .rec-row { display: flex; gap: 8px; align-items: center; }

  /* ---------- car park / not-do ---------- */
  .tbl { display: flex; flex-direction: column; }
  .cp { display: grid; grid-template-columns: minmax(0, 1.6fr) 110px 70px 70px 150px minmax(0, 1fr) 180px 30px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
  .cp.head { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); }
  .cp.head span { padding: 0 7px; }
  .hml { font-family: var(--mono); font-size: 12px; padding: 4px; }
  .nd { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr) 30px; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line-soft); }
  .tri-mini { display: inline-flex; gap: 4px; }
  .tri-mini button {
    font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 5px; padding: 3px 5px; cursor: pointer;
  }
  .tri-mini button.on { background: var(--teal); border-color: var(--teal); color: #fff; }

  /* ---------- actions view ---------- */
  .group { margin-bottom: 18px; }
  .group h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  .dlog { display: grid; grid-template-columns: 110px minmax(0, 1fr) 110px 90px; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; align-items: baseline; }

  /* ---------- playbook ---------- */
  .pb { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pb .panel { padding: 16px 18px; }
  .pb .span2 { grid-column: 1 / -1; }
  .q { margin-bottom: 14px; }
  .q-num { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; }
  .q-title { font-family: var(--serif); font-size: 17px; font-weight: 500; margin: 0 0 2px; }
  .gmap { display: grid; grid-template-columns: 130px 1fr 1fr; gap: 4px 10px; align-items: center; font-size: 13.5px; }
  .gmap .hd { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .gmap .gt { font-weight: 600; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13.5px; }
  .bar-track { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--red-soft) 0 50%, var(--amber-soft) 50% 75%, var(--green-soft) 75% 100%); }
  .bar-fill { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 99px; background: var(--text); transform: translate(-50%, -50%); border: 2px solid var(--panel); }
  .bar-val { font-family: var(--mono); font-size: 12.5px; text-align: right; }
  .rhythm { display: grid; grid-template-columns: 150px 90px minmax(0, 1fr); gap: 6px 10px; align-items: start; }

  /* ---------- settings ---------- */
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .settings .panel { padding: 16px 18px; }
  .settings .field { margin-bottom: 12px; }
  .settings .field .in, .settings .field .ta { font-family: var(--sans); font-size: 14px; border-color: var(--line); background: var(--panel); }
  .note-box { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  /* ---------- modal / toast ---------- */
  .modal-back { position: fixed; inset: 0; background: rgba(21, 33, 46, .42); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .modal { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: 100%; max-width: 440px; padding: 22px; max-height: 90vh; overflow: auto; }
  .modal h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0 0 14px; }
  .modal .field { margin-bottom: 11px; }
  .modal .field .in, .modal .field .sel { font-family: var(--sans); font-size: 14px; padding: 8px 10px; width: 100%; border-color: var(--line); background: var(--ground); }
  .modal-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: var(--text); color: var(--ground);
    font-size: 13.5px; padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 70;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .loading { text-align: center; color: var(--muted); padding: 60px 20px; font-family: var(--mono); font-size: 13px; }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    .planner, .meeting-grid, .pb, .settings, .cards2 { grid-template-columns: 1fr; }
    .sidebar, .aside { position: static; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 16px 16px 80px; }
    .trow { grid-template-columns: 26px minmax(0, 1fr) 30px; }
    .trow > :nth-child(3), .trow > :nth-child(4), .trow > :nth-child(5) { grid-column: 2 / 3; }
    .trow.thead { display: none; }
    .arow, .crow, .drow, .cp, .nd, .topic-top { grid-template-columns: 1fr 1fr; }
    .arow > *, .crow > *, .drow > *, .cp > *, .nd > *, .topic-top > * { grid-column: auto; }
    .rv { grid-template-columns: 1fr; }
    .cp.head { display: none; }
    .lr { grid-template-columns: 1fr; }
    .success, .kv2 { grid-template-columns: 1fr; }
    .dlog { grid-template-columns: 1fr 1fr; }
    .trend { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    body { background: #fff; }
    .tabs, .who, .banner, .btn, .icon-btn, .handle, .aside, .toast, .back { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    .sec, .obj, .panel { box-shadow: none; break-inside: avoid; }
    .meeting-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="orgLine">SLT</p>
        <h1 class="goal-title" id="goalTitle">Scoreboard</h1>
        <p class="goal-meta" id="goalMeta"></p>
      </div>
      <div class="who">
        <label for="mePick">You</label>
        <select class="sel" id="mePick"></select>
        <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
      </div>
    </header>
    <div class="banner" id="publicBanner" hidden>
      This site isn't behind a sign-in yet, so anyone with the link can see and change it.
      Switch on Cloudflare Access before adding anything sensitive. <a href="#/settings">How to fix</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <main id="view"><div class="loading">Loading…</div></main>
  </div>

  <datalist id="people"></datalist>

  <div class="modal-back" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ======================================================================
  // Constants
  // ======================================================================
  const STATUS = { green: "On track", amber: "At risk", red: "Off track", "": "Not set" };
  const KINDS = {
    tactical: { label: "Weekly tactical", minutes: 75 },
    strategic: { label: "Strategic", minutes: 180 },
    offsite: { label: "Quarterly off-site", minutes: 480 },
    board: { label: "Board", minutes: 120 },
    subcommittee: { label: "Subcommittee", minutes: 90 },
    team: { label: "Team meeting", minutes: 60 },
  };
  const FLAGS = { inform: "Inform", debate: "Debate", decide: "Decide" };
  const GENIUS = ["Wonder", "Invention", "Discernment", "Galvanising", "Enablement", "Tenacity"];
  const NOTDO = ["Stop", "Pause", "Slow", "De-scope", "MVP / Enough"];
  const TACTICAL_FIXED = 25; // lightning 10 + scoreboard 5 + decisions 5 + cascade 5
  const TABS = [
    ["scoreboard", "Scoreboard"], ["meetings", "Meetings"], ["carpark", "Car park"],
    ["actions", "Actions"], ["playbook", "Playbook"], ["settings", "Settings"],
  ];

  // ======================================================================
  // Small helpers
  // ======================================================================
  const $ = (id) => document.getElementById(id);

  // Build an element. Props: class, text, on<event>, dataset, value, checked, and attributes.
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    let value;
    if (props) {
      for (const k of Object.keys(props)) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k === "value") value = v;
        else if (k === "checked") el.checked = !!v;
        else if (k === "dataset") Object.assign(el.dataset, v);
        else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : String(kid));
    }
    if (value !== undefined) el.value = value;
    return el;
  }

  const pad = (n) => String(n).padStart(2, "0");
  const isoLocal = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => isoLocal(new Date());
  function parseISO(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
  function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoLocal(d); }
  function monday(s) { const d = parseISO(s || today()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoLocal(d); }
  function nextDow(dow) { const d = new Date(); let add = (dow - d.getDay() + 7) % 7; if (add === 0) add = 7; d.setDate(d.getDate() + add); return isoLocal(d); }
  const shortDate = (s) => s ? parseISO(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";
  const longDate = (s) => s ? parseISO(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "";
  const dayMonth = (s) => s ? parseISO(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
  function relTime(ts) {
    if (!ts) return "";
    const mins = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " min ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.round(hrs / 24);
    return days === 1 ? "yesterday" : days + " days ago";
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : ""; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  function autoGrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  const firstName = (s) => String(s || "").split(/[.\s_@-]/)[0].toLowerCase();

  let toastTimer;
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  // ======================================================================
  // Store: records loaded from /api/records, saved field-by-field
  // ======================================================================
  const S = { records: [], byId: new Map(), me: lsGet("slt-me") || "", email: "", loaded: false };

  function index() { S.byId = new Map(S.records.map((r) => [r.id, r])); }
  const get = (id) => S.byId.get(id);
  function list(c, parent) {
    return S.records
      .filter((r) => r.c === c && (parent === undefined || r.parent === parent))
      .sort((a, b) => (a.position - b.position) || String(a.created_at).localeCompare(String(b.created_at)));
  }
  const kv = (id) => (get(id) || { data: {} }).data;
  const members = () => (kv("kv-team").members || []).filter(Boolean);
  function nextPos(c, parent) { const l = list(c, parent); return l.length ? Math.max(...l.map((r) => r.position)) + 1 : 1; }

  let inflight = 0;
  function api(method, path, body, keepalive) {
    inflight++;
    setSave("saving");
    return fetch("/api" + path, {
      method,
      keepalive: !!keepalive,
      headers: { "content-type": "application/json", "X-SLT-User": S.me || "" },
      body: body === undefined ? undefined : JSON.stringify(body),
    }).then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).finally(() => { inflight--; if (inflight === 0 && !pend.size) setSave("saved"); });
  }

  let saveFailed = false;
  function setSave(state) {
    const el = $("saveState");
    if (state === "error") { saveFailed = true; el.textContent = "Not saved — retrying"; el.classList.add("error"); return; }
    if (state === "saved") {
      if (saveFailed) return;
      el.textContent = "Saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      el.classList.remove("error"); return;
    }
    if (!saveFailed) { el.textContent = state === "editing" ? "Editing…" : "Saving…"; el.classList.remove("error"); }
  }

  // Serialise requests per record so a PATCH never overtakes its POST.
  const chains = new Map();
  function chain(id, fn) {
    const p = (chains.get(id) || Promise.resolve()).then(fn);
    chains.set(id, p.catch(() => {}));
    return p;
  }

  function create(c, data, parent = null, position) {
    const rec = {
      id: uid(), c, parent, position: position == null ? nextPos(c, parent) : position,
      data: { ...data }, created_at: new Date().toISOString(), updated_at: "", updated_by: S.me,
    };
    S.records.push(rec); S.byId.set(rec.id, rec);
    const send = () => api("POST", "/records", { id: rec.id, c, parent, position: rec.position, data: rec.data });
    chain(rec.id, () => send().catch(() => { setSave("error"); return new Promise((r) => setTimeout(r, 3000)).then(send); })
      .then(() => { saveFailed = false; }).catch(() => setSave("error")));
    return rec;
  }

  const pend = new Map(); // id -> { fields, timer }
  function update(id, fields, delay = 600) {
    const rec = get(id);
    if (!rec) return;
    Object.assign(rec.data, fields);
    const p = pend.get(id) || { fields: {} };
    Object.assign(p.fields, fields);
    clearTimeout(p.timer);
    p.timer = setTimeout(() => flush(id), delay);
    pend.set(id, p);
    setSave("editing");
  }
  function flush(id, keepalive) {
    const p = pend.get(id);
    if (!p) return Promise.resolve();
    pend.delete(id); clearTimeout(p.timer);
    return chain(id, () => api("PATCH", "/records/" + id, { data: p.fields }, keepalive).then((res) => {
      saveFailed = false;
      const rec = get(id);
      if (rec && res.record) {
        rec.updated_at = res.record.updated_at; rec.updated_by = res.record.updated_by;
        if (rec.c === "objective") { rec.data.status_at = res.record.data.status_at; rec.data.status_by = res.record.data.status_by; }
      }
      if (inflight === 0 && !pend.size) setSave("saved");
    }).catch(() => {
      const again = pend.get(id) || { fields: {} };
      pend.set(id, { fields: { ...p.fields, ...again.fields }, timer: setTimeout(() => flush(id), 4000) });
      setSave("error");
    }));
  }
  const flushAll = (keepalive) => Promise.all([...pend.keys()].map((id) => flush(id, keepalive)));

  function move(id, parent, position) {
    const rec = get(id);
    if (!rec) return;
    rec.parent = parent; rec.position = position;
    chain(id, () => api("PATCH", "/records/" + id, { parent, position }).catch(() => setSave("error")));
  }

  function removeRec(id) {
    const rec = get(id);
    if (!rec) return;
    const p = pend.get(id); if (p) { clearTimeout(p.timer); pend.delete(id); }
    S.records = S.records.filter((r) => r.id !== id && r.parent !== id);
    if (rec.c === "meeting") {
      for (const cp of list("carpark")) if (cp.data.meeting_id === id) Object.assign(cp.data, { status: "parked", meeting_id: "" });
    }
    index();
    chain(id, () => api("DELETE", "/records/" + id).catch(() => setSave("error")));
  }

  // create() picks a random id; singletons need a fixed one, so post them directly.
  function kvRecord(id) {
    let rec = get(id);
    if (rec) return rec;
    rec = { id, c: "kv", parent: null, position: 0, data: {}, created_at: new Date().toISOString() };
    S.records.push(rec); S.byId.set(id, rec);
    chain(id, () => api("POST", "/records", { id, c: "kv", data: {} }).catch(() => setSave("error")));
    return rec;
  }

  const editing = () => {
    const a = document.activeElement;
    return a && $("view").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  };

  function refresh(force) {
    if (!force && (pend.size || inflight || editing() || !$("modal").hidden)) return Promise.resolve();
    return fetch("/api/records", { headers: { "X-SLT-User": S.me || "" } })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then((res) => {
        if (!force && (pend.size || inflight || editing())) return;
        S.records = res.records || []; index(); S.loaded = true; render();
      });
  }

  // ======================================================================
  // Domain helpers
  // ======================================================================
  const defining = () => list("objective").filter((o) => o.data.type !== "soo");
  const soos = () => list("objective").filter((o) => o.data.type === "soo");
  const meetings = () => list("meeting").slice().sort((a, b) => (a.data.date || "").localeCompare(b.data.date || "") || (a.data.start || "").localeCompare(b.data.start || ""));
  const meetingName = (m) => (m.data.title || "").trim() || (m.data.kind === "subcommittee" && m.data.label) || (KINDS[m.data.kind] || KINDS.team).label;
  const kindOf = (m) => (KINDS[m.data.kind] ? m.data.kind : "team");
  const isOverdue = (d) => !!(d.due && !d.done && d.due < today());
  const isGap = (d) => !d.done && (!String(d.who || "").trim() || !d.due);
  const thisWeek = (ts) => !!ts && isoLocal(new Date(ts)) >= monday();

  function taskStats(tasks) {
    return {
      total: tasks.length,
      done: tasks.filter((t) => t.data.done).length,
      gaps: tasks.filter((t) => isGap(t.data)).length,
      overdue: tasks.filter((t) => isOverdue(t.data)).length,
    };
  }
  function nextMeeting(kind) {
    const t = today();
    return meetings().find((m) => (m.data.date || "") >= t && (!kind || m.data.kind === kind));
  }
  function nextChairAfter(date) {
    const team = members();
    if (!team.length) return "";
    const prev = meetings().filter((m) => m.data.kind === "tactical" && m.data.chair && (m.data.date || "") < date).pop();
    if (!prev) return team[0];
    const i = team.indexOf(prev.data.chair);
    return team[(i + 1) % team.length];
  }
  function upsertLocalLog(obj) {
    const week = monday();
    let log = list("status_log", obj.id).find((l) => l.data.week === week);
    if (!log) {
      log = { id: "local-" + uid(), c: "status_log", parent: obj.id, position: 0, data: { week }, created_at: new Date().toISOString() };
      S.records.push(log); S.byId.set(log.id, log);
    }
    Object.assign(log.data, { status: obj.data.status, note: obj.data.note, by: S.me });
  }
  function setStatus(obj, status) {
    update(obj.id, { status }, 100);
    obj.data.status_at = new Date().toISOString(); obj.data.status_by = S.me;
    upsertLocalLog(obj);
    render();
  }

  // ======================================================================
  // Reusable bits of UI
  // ======================================================================
  function bindIn(rec, field, props, after) {
    const el = h("input", Object.assign({ type: "text", class: "in", value: rec.data[field] == null ? "" : rec.data[field] }, props || {}));
    el.addEventListener("input", () => { update(rec.id, { [field]: el.value }); if (after) after(el); });
    return el;
  }
  function bindTa(rec, field, props, after) {
    const el = h("textarea", Object.assign({ class: "ta", rows: "1", value: rec.data[field] == null ? "" : rec.data[field] }, props || {}));
    el.addEventListener("input", () => { update(rec.id, { [field]: el.value }); autoGrow(el); if (after) after(el); });
    requestAnimationFrame(() => autoGrow(el));
    return el;
  }
  // A textarea editing an array field as one item per line.
  function bindLines(rec, field, props) {

  // ======================================================================

  function modal(title, body, okLabel, onOk) {
    const back = $("modal");
    $("modalTitle").textContent = title;
    $("modalBody").replaceChildren(body);
    $("modalOk").textContent = okLabel;
    back.hidden = false;
    const close = () => { back.hidden = true; document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("modalCancel").onclick = close;
    back.onclick = (e) => { if (e.target === back) close(); };
    $("modalOk").onclick = () => { if (onOk() !== false) close(); };
    const first = body.querySelector("input, select, textarea");
    if (first) first.focus();
  }

    $("orgLine").textContent = [org.name, org.team_label || "SLT"].filter(Boolean).join(" · ");
    $("goalTitle").textContent = goal.title || "Scoreboard";
    const traits = (goal.traits || []).join(" · ");
    $("goalMeta").textContent = goal.title ? ["Thematic goal", goal.period, traits].filter(Boolean).join(" · ") : "";
    document.title = (goal.title ? goal.title + " · " : "") + (org.team_label || "SLT") + " Scoreboard";
    $("publicBanner").hidden = !S.loaded || !!S.email;

    const team = members();
    const pick = $("mePick");
    pick.replaceChildren(h("option", { value: "" }, "Choose…"), ...team.map((m) => h("option", { value: m }, m)));
    if (S.me && !team.includes(S.me)) pick.append(h("option", { value: S.me }, S.me));
    pick.value = S.me || "";
    pick.parentElement.querySelector("label").hidden = !team.length;
    pick.hidden = !team.length;

    $("people").replaceChildren(...[...team, "Whole team", "SLT"].map((p) => h("option", { value: p })));

    const r = route();
    const overdueActions = list("action").filter((a) => isOverdue(a.data)).length;
    $("tabs").replaceChildren(...TABS.map(([key, label]) => {
      const on = r.name === key || (r.name === "meeting" && key === "meetings");

    }));
  }

  function render() {
    if (!S.loaded) return;
    const r = route();
    const key = r.name + "/" + r.id;
    const y = window.scrollY;
    renderShell();
    let node;
    switch (r.name) {
      case "meetings": node = viewMeetings(); break;
      case "meeting": node = viewMeeting(r.id); break;
      case "carpark": node = viewCarpark(); break;
      case "actions": node = viewActions(); break;
      case "playbook": node = viewPlaybook(); break;
      case "settings": node = viewSettings(); break;
      default: node = viewScoreboard();
    }
    $("view").replaceChildren(node);
    if (key === lastRouteKey) window.scrollTo(0, y); else window.scrollTo(0, 0);
    lastRouteKey = key;
  }

  // ======================================================================

  // ======================================================================
  let showPast = false;

  function viewMeetings() {
    const t = today();
    const from = showPast ? "0000" : addDays(t, -14);
    const to = addDays(t, 92);
    const shown = meetings().filter((m) => (m.data.date || "") >= from && (m.data.date || "") <= to);
    const next = nextMeeting();

    const months = [];
    const byKey = {};
    for (const m of shown) {
      const d = parseISO(m.data.date);
      const key = d.getFullYear() + "-" + d.getMonth();
      if (!byKey[key]) { byKey[key] = { label: d.toLocaleDateString("en-GB", { month: "long", year: "numeric" }), items: [] }; months.push(byKey[key]); }
      byKey[key].items.push(m);
    }

    const head = h("div", { class: "row", style: "margin-bottom:14px" },
      h("button", { class: "btn", onclick: scheduleTacticals }, "+ Weekly tacticals…"),
      h("button", { class: "btn", onclick: scheduleStrategic }, "+ Strategic meetings…"),
      h("button", { class: "btn primary", onclick: () => addMeeting() }, "+ Add meeting"),
      h("span", { class: "spacer" }),
      h("label", { class: "row small muted", style: "gap:6px;cursor:pointer" },
        h("input", { type: "checkbox", checked: showPast, onchange: (e) => { showPast = e.target.checked; render(); } }), "Show all past meetings"));

    const legend = h("div", { class: "legend", style: "margin-bottom:16px" },
      Object.keys(KINDS).map((k) => h("span", { class: "k-" + k }, h("i"), KINDS[k].label)));

    const main = shown.length
      ? h("div", { class: "months" }, months.map((g) => h("section", { class: "month" },
          h("h3", {}, g.label), h("div", { class: "cols" }, g.items.map((m) => meetingColumn(m, next))))))
      : emptyState("No meetings in the next 3 months", "Schedule your weekly tacticals and strategic meetings to fill in the rhythm.",
          h("button", { class: "btn primary", onclick: scheduleTacticals }, "+ Weekly tacticals…"));

    return h("div", {}, head, legend,
      h("div", { class: "planner" }, main, carparkSidebar()),
      h("p", { class: "muted small", style: "margin-top:16px" },
        "Drag a topic between meetings to move it, or onto the car park to park it. Drag a car park topic onto a meeting to schedule it."));
  }

  function dragSource(el, payload) {
    el.addEventListener("dragstart", (e) => {
      drag = payload; el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", payload.id); } catch (err) { /* older browsers */ }
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging"); drag = null;
      document.querySelectorAll(".drop").forEach((x) => x.classList.remove("drop"));
    });
  }
  function dropTarget(el, onDrop) {
    el.addEventListener("dragover", (e) => { if (!drag) return; e.preventDefault(); el.classList.add("drop"); });
    el.addEventListener("dragleave", (e) => { if (!el.contains(e.relatedTarget)) el.classList.remove("drop"); });
    el.addEventListener("drop", (e) => {
      e.preventDefault(); el.classList.remove("drop");
      if (!drag) return;
      const d = drag; drag = null;
      onDrop(d);
    });
  }

  function pullCarpark(cp, meetingId) {
    if (!cp) return;
    const m = get(meetingId);
    create("topic", {
      title: cp.data.topic || "", owner: cp.data.owner || "", flag: "debate",
      minutes: m && m.data.kind === "tactical" ? 10 : 45, source: "car park", carpark_id: cp.id,
      notes: cp.data.notes || "", triangle: cp.data.triangle || {}, genius: [], bluf: "", preread: "", decision: "",
    }, meetingId);
    update(cp.id, { status: "scheduled", meeting_id: meetingId }, 100);
  }
  function parkTopic(tp) {
    if (!tp) return;
    if (tp.data.carpark_id && get(tp.data.carpark_id)) {
      update(tp.data.carpark_id, { status: "parked", meeting_id: "" }, 100);
    } else {
      create("carpark", {
        topic: tp.data.title || "", owner: tp.data.owner || "", urgency: "M", importance: "M",
        triangle: tp.data.triangle || {}, notes: tp.data.notes || "", status: "parked", meeting_id: "", from_meeting: tp.parent,
      });
    }
    removeRec(tp.id);

  function copySummary(m) {
    flushAll();
    const lines = [meetingName(m) + " — " + longDate(m.data.date)];
    if (m.data.chair) lines.push("Chair: " + m.data.chair);
    const ds = list("decision", m.id).filter((d) => d.data.text);
    const as = list("action", m.id).filter((a) => a.data.text);
    const will = list("cascade", m.id).filter((c) => c.data.kind === "will" && c.data.text);
    const wont = list("cascade", m.id).filter((c) => c.data.kind === "wont" && c.data.text);
    if (ds.length) { lines.push("", "Decisions"); ds.forEach((d) => lines.push("- " + d.data.text + (d.data.owner ? " (" + d.data.owner + ")" : ""))); }
    if (as.length) { lines.push("", "Actions"); as.forEach((a) => lines.push("- " + a.data.text + " — " + (a.data.owner || "no owner") + (a.data.due ? ", by " + dayMonth(a.data.due) : ""))); }
    if (will.length) { lines.push("", "We will say"); will.forEach((c) => lines.push("- " + c.data.text + (c.data.who ? " — " + c.data.who : "") + (c.data.by ? ", " + c.data.by : ""))); }
    if (wont.length) { lines.push("", "Stays in the room"); wont.forEach((c) => lines.push("- " + c.data.text)); }
    const text = lines.join("\n");
    const done = () => toast("Summary copied");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text));
    else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast("Summary copied"); } catch (e) { toast("Couldn't copy — select and copy manually"); }
    ta.remove();
  }

          const v = Number((health.scores || {})[k]);
          return h("div", { class: "bar" }, h("span", {}, label),
            h("span", { class: "bar-track", title: label + ": " + v }, h("span", { class: "bar-fill", style: "left:" + Math.max(0, Math.min(100, ((v - 1) / 4) * 100)) + "%" })),
            h("span", { class: "bar-val", style: v < 3 ? "color:var(--red);font-weight:600" : "" }, isNaN(v) ? "–" : v.toFixed(2)));
        })),
        health.weakest && health.weakest.length ? [h("div", { class: "subhead" }, "Lowest-scoring behaviours"),
          h("ul", { class: "small", style: "margin:0;padding-left:18px" }, health.weakest.map((w) => h("li", {}, w.q, " ", h("span", { class: "mono muted" }, Number(w.score).toFixed(2)))))] : null) : null);
  }

  // ======================================================================
  // View: Settings (team, goal, import/export)
  // ======================================================================
  function viewSettings() {
    const org = kvRecordView("kv-org"), goal = kvRecordView("kv-goal"), team = kvRecordView("kv-team");
    const fileIn = h("input", { type: "file", accept: "application/json,.json", "aria-label": "Import file" });
    const importNote = h("p", { class: "small muted", style: "margin:8px 0 0" });
    fileIn.addEventListener("change", () => importFile(fileIn, importNote));

    return h("div", { class: "settings" },
      h("section", { class: "panel" },
        h("h2", { class: "h2", style: "margin-bottom:12px" }, "Team"),
        field("Organisation", lazyIn(org, "name", "Your organisation")),
        field("Team name", lazyIn(org, "team_label", "SLT")),
        field("Team members, one per line (the chair rotates in this order)", lazyLines(team, "members")),
        h("p", { class: "note-box" }, "Pick who you are at the top of the page, so status updates and edits are signed with your name.")),
      h("section", { class: "panel" },
        h("h2", { class: "h2", style: "margin-bottom:12px" }, "Thematic goal"),
        field("Goal", lazyIn(goal, "title", "Our rallying cry")),
        field("Period", lazyIn(goal, "period", "e.g. Sep 2026 – Jun 2027")),
        field("Qualities, comma separated", (() => {
          const el = h("input", { class: "in", value: (goal.rec().data.traits || []).join(", "), placeholder: "Singular, Near-term, Qualitative, Shared" });
          el.addEventListener("input", () => update(goal.rec(true).id, { traits: el.value.split(",").map((s) => s.trim()).filter(Boolean) }));
          return el;
        })())),
      h("section", { class: "panel" },
        h("h2", { class: "h2", style: "margin-bottom:8px" }, "Import"),
        S.email
          ? h("p", { class: "note-box" }, "Signed in as " + S.email + " through Cloudflare Access.")
          : h("p", { class: "banner", style: "margin:0 0 12px" }, "Not behind a sign-in yet. Before importing anything sensitive, switch on Cloudflare Access: Cloudflare dashboard → Zero Trust → Access → Applications → Add a self-hosted app for this site's domain (and *.domain for previews), with a policy allowing only your team's emails."),
        h("p", { class: "note-box" }, "Load a scoreboard file (.json). Records with the same id are replaced, so importing the same file twice won't create duplicates."),
        fileIn, importNote),
      h("section", { class: "panel" },
        h("h2", { class: "h2", style: "margin-bottom:8px" }, "Backup"),
        h("p", { class: "note-box" }, "Download everything — scoreboard, meetings, actions, car park, playbook — as one file. Keep it somewhere private."),
        h("button", { class: "btn", onclick: exportAll }, "Download backup")));
  }

  // Settings edits singletons that may not exist yet; create them on first edit.
  function kvRecordView(id) { return { rec: (create) => get(id) || (create ? kvRecord(id) : { id, data: {} }) }; }
  function lazyIn(view, fieldName, ph) {
    const el = h("input", { class: "in", value: view.rec().data[fieldName] || "", placeholder: ph });
    el.addEventListener("input", () => { update(view.rec(true).id, { [fieldName]: el.value }); renderShell(); });
    return el;
  }
  function lazyLines(view, fieldName) {
    const el = h("textarea", { class: "ta boxed", rows: "4", value: (view.rec().data[fieldName] || []).join("\n"), placeholder: "One name per line" });
    el.addEventListener("input", () => { update(view.rec(true).id, { [fieldName]: el.value.split("\n").map((s) => s.trim()).filter(Boolean) }); autoGrow(el); renderShell(); });
    requestAnimationFrame(() => autoGrow(el));
    return el;
  }

  function importFile(input, note) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let payload;
      try { payload = JSON.parse(reader.result); } catch (e) { note.textContent = "That file isn't valid JSON."; return; }
      if (!payload || payload.format !== "slt-scoreboard" || !Array.isArray(payload.records)) {
        note.textContent = "That isn't a scoreboard file. Use a file made for this app, or one downloaded from Backup."; return;
      }
      const counts = {};
      payload.records.forEach((r) => { counts[r.c] = (counts[r.c] || 0) + 1; });
      const summary = Object.entries(counts).map(([c, n]) => n + " " + c).join(", ");
      if (!S.email && !confirm("This site isn't behind a sign-in yet, so anyone with the link could see what you import. Import anyway?")) { input.value = ""; return; }
      if (!confirm("Import " + payload.records.length + " records (" + summary + ")? Records with the same id will be replaced.")) { input.value = ""; return; }
      note.textContent = "Importing…";
      const recs = payload.records.map((r) => ({ id: r.id, c: r.c, parent: r.parent || null, position: Number(r.position) || 0, data: r.data || {} }));
      const chunks = [];
      for (let i = 0; i < recs.length; i += 200) chunks.push(recs.slice(i, i + 200));
      chunks.reduce((p, chunk) => p.then(() => api("POST", "/records", { records: chunk })), Promise.resolve())
        .then(() => refresh(true))
        .then(() => { note.textContent = "Imported " + recs.length + " records."; toast("Imported " + recs.length + " records"); input.value = ""; })
        .catch(() => { note.textContent = "Import failed part-way. Nothing is lost — try again; matching records are replaced, not duplicated."; setSave("error"); });
    };
    reader.readAsText(file);
  }

  function exportAll() {
    flushAll().then(() => fetch("/api/records", { headers: { "X-SLT-User": S.me || "" } })).then((r) => r.json()).then((res) => {
      const payload = { format: "slt-scoreboard", version: 1, created: new Date().toISOString(),
        records: (res.records || []).map((r) => ({ c: r.c, id: r.id, parent: r.parent, position: r.position, data: r.data })) };
      const blob = new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" });
      const a = h("a", { href: URL.createObjectURL(blob), download: "slt-scoreboard-backup-" + today() + ".json" });
      document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
      toast("Backup downloaded");
    }).catch(() => toast("Couldn't download the backup"));
  }

  // ======================================================================
  // Boot
  // ======================================================================
  $("mePick").addEventListener("change", (e) => { S.me = e.target.value; lsSet("slt-me", S.me); toast(S.me ? "Edits will be signed " + S.me : "Edits won't be signed"); });
  window.addEventListener("hashchange", () => { flushAll(); render(); });
  window.addEventListener("pagehide", () => flushAll(true));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);

  Promise.all([
    fetch("/api/whoami").then((r) => r.json()).catch(() => ({ email: "" })),
    fetch("/api/records").then((r) => { if (!r.ok) throw new Error(); return r.json(); }),
  ]).then(([who, res]) => {
    S.email = who.email || "";
    S.records = res.records || []; index(); S.loaded = true;
    if (S.email && !S.me) { // match the Access email to a team member's first name
      const fn = firstName(S.email);
      const match = members().find((m) => firstName(m) === fn);
      if (match) { S.me = match; lsSet("slt-me", match); }
    }
    render();
    setSave("saved"); $("saveState").textContent = "";
  }).catch(() => {
    $("view").replaceChildren(emptyState("Couldn't load", "The server didn't respond. Check your connection and refresh."));
  });
})();
</script>
</body>
</html>
